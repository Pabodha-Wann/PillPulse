# ─────────────────────────────────────────────────────────
# 🎓 K8s Learning: Medicine Service
#
# Manages the global medication catalog and inventory.
# Depends on: postgres-medicine, rabbitmq, eureka-server
# ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicine-service
  labels:
    app: medicine-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medicine-service
  template:
    metadata:
      labels:
        app: medicine-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c',
            'until nc -z postgres-medicine 5432; do echo "⏳ Waiting for PostgreSQL..."; sleep 2; done; echo "✅ PostgreSQL is ready!"']
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ['sh', '-c',
            'until nc -z rabbitmq 5672; do echo "⏳ Waiting for RabbitMQ..."; sleep 2; done; echo "✅ RabbitMQ is ready!"']
        - name: wait-for-eureka
          image: busybox:1.36
          command: ['sh', '-c',
            'until wget -q --spider http://eureka-server:8761/actuator/health 2>/dev/null; do echo "⏳ Waiting for Eureka..."; sleep 3; done; echo "✅ Eureka is ready!"']
      containers:
        - name: medicine-service
          image: medicine-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pillpulse-secrets
                  key: DB_PASSWORD
          ports:
            - containerPort: 8082
              name: http
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: medicine-service
spec:
  ports:
    - port: 8082
      targetPort: 8082
      name: http
  selector:
    app: medicine-service
