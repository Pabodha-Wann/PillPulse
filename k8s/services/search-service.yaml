# ─────────────────────────────────────────────────────────
# 🎓 K8s Learning: Search Service
#
# The GPS radius search engine. Calculates distances
# between user location and pharmacies using Haversine.
# Depends on: eureka-server only (no database)
# ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  labels:
    app: search-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      initContainers:
        - name: wait-for-eureka
          image: busybox:1.36
          command: ['sh', '-c',
            'until wget -q --spider http://eureka-server:8761/actuator/health 2>/dev/null; do echo "⏳ Waiting for Eureka..."; sleep 3; done; echo "✅ Eureka is ready!"']
      containers:
        - name: search-service
          image: search-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
          ports:
            - containerPort: 8083
              name: http
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
spec:
  ports:
    - port: 8083
      targetPort: 8083
      name: http
  selector:
    app: search-service
