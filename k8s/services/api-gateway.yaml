# ─────────────────────────────────────────────────────────
# 🎓 K8s Learning: API Gateway
#
# The single entry point for ALL backend requests.
# Frontend talks to this, and it routes to the correct
# microservice. Also validates Keycloak JWT tokens.
#
# Init Containers: Waits for Eureka + Keycloak before starting
# NodePort 30080 = API access (http://localhost:30080)
# ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      # 🎓 Init Containers run BEFORE the main container.
      # They block startup until dependencies are ready.
      initContainers:
        - name: wait-for-eureka
          image: busybox:1.36
          command: ['sh', '-c',
            'until wget -q --spider http://eureka-server:8761/actuator/health 2>/dev/null; do echo "⏳ Waiting for Eureka..."; sleep 3; done; echo "✅ Eureka is ready!"']
        - name: wait-for-keycloak
          image: busybox:1.36
          command: ['sh', '-c',
            'until wget -q --spider http://keycloak:8080/health/ready 2>/dev/null; do echo "⏳ Waiting for Keycloak..."; sleep 3; done; echo "✅ Keycloak is ready!"']
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      name: http
  selector:
    app: api-gateway
