# ─────────────────────────────────────────────────────────
# 🎓 PostgreSQL for medicine-service
# ─────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-medicine-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-medicine
  labels:
    app: postgres-medicine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-medicine
  template:
    metadata:
      labels:
        app: postgres-medicine
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              value: "medicine_db"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pillpulse-secrets
                  key: DB_PASSWORD
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: postgres-medicine-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-medicine-storage
          persistentVolumeClaim:
            claimName: postgres-medicine-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-medicine
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-medicine
